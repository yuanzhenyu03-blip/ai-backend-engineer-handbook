[pytest]
# Put the Day62 `src/` package dir on the import path so `tests/` can import the modules
# under test (e.g. `from day62_interaction_logic import ...`) WITHOUT any per-file sys.path
# manipulation. Requires pytest >= 7.0 (pinned to 7.4.3 in requirements-day62.txt).
pythonpath = src
testpaths = tests
