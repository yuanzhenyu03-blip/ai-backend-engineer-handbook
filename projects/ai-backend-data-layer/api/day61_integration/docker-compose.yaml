# Day61 — disposable local INTEGRATION_RUNTIME stack (OPT-IN; NOT executed by the updating
# agent). Provides PostgreSQL, Redis, MinIO (S3-compatible), and an OTel Collector. Secrets
# below are LOCAL-ONLY throwaway placeholders supplied at run time via a .env you create
# yourself; do NOT commit a real .env. The FastAPI/Relay/Celery-Worker and the separate fake
# HTTP Provider run as host processes (see the runbook), not in this compose file.
services:
  day61-pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DAY61_PG_PASSWORD:?set in your local .env}
    ports:
      - "127.0.0.1:5432:5432"
  day61-redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
  day61-minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${DAY61_S3_ACCESS_KEY:?set in your local .env}
      MINIO_ROOT_PASSWORD: ${DAY61_S3_SECRET_KEY:?set in your local .env}
    ports:
      - "127.0.0.1:9000:9000"
  day61-otel:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
