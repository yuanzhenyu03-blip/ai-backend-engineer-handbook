# Day61 — OpenTelemetry Collector config (disposable local INTEGRATION_RUNTIME).
# Diagnostic correlation only; NOT a transactional prerequisite. A Collector/exporter
# failure must NOT roll back a committed Job or trigger a duplicate Provider call.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  # 'debug' writes traces/metrics to the Collector log for local evidence capture.
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
