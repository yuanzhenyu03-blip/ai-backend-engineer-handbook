# Day48 — Alembic migration control plane for the Lease safe-evolution of app.jobs.
# This is a DEPLOYMENT control plane, NOT FastAPI startup and NOT a Day47 request/Job UoW.
#
# Database URL resolution (env.py, highest priority first):
#   1. alembic -x db_url=<url>
#   2. env var DAY48_ALEMBIC_DATABASE_URL
#   3. the sqlalchemy.url below — OFFLINE `--sql` rendering ONLY.
# The sqlalchemy.url below is a NON-CREDENTIAL PLACEHOLDER used ONLY for offline
# `--sql` rendering (dialect selection; it NEVER connects and is NOT a production
# connection configuration). It is NOT an online connection fallback: an ONLINE
# migration REQUIRES `-x db_url=...` or DAY48_ALEMBIC_DATABASE_URL and env.py fails
# fast otherwise. NEVER commit a real connection string, username, password, or token.
[alembic]
script_location = %(here)s
sqlalchemy.url = postgresql://localhost/appdb_placeholder

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
