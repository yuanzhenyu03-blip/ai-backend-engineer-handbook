# Day48 — Alembic migration control plane for the Lease safe-evolution of app.jobs.
# This is a DEPLOYMENT control plane, NOT FastAPI startup and NOT a Day47 request/Job UoW.
# The URL below is a NON-CREDENTIAL placeholder used ONLY for offline `--sql` rendering
# (which selects the PostgreSQL dialect and never connects). For a real run, pass a
# connection via the environment / -x db_url=... and NEVER commit real credentials.
[alembic]
script_location = %(here)s
sqlalchemy.url = postgresql://localhost/appdb_placeholder

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
