name: AI agent classroom quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-agent-classroom:
    name: Python 3.12 tests and seed evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/ai-agent
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned classroom integration dependencies
        run: python -m pip install -r requirements-day88.txt -r requirements-day90.txt -r requirements-day106-l3.txt
      - name: Check interpreter and compile Python sources
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python -m compileall -q src tests evals examples
      - name: Run full AI agent regression suite
        run: python -m unittest discover -s tests -q
      - name: Run Day106 pytest contract suite
        run: python -m pytest -q tests/test_day106_*.py
      - name: Run every available seed evaluator
        run: |
          for evaluator in evals/run_day*_seed_eval.py; do
            python "$evaluator"
          done
      - name: Verify saved Day96 experiment report
        run: |
          python -c 'import json; from pathlib import Path; from examples.day96_chunking_experiments import run_example; expected = json.loads(Path("evidence/day96-experiment-report.json").read_text()); actual = json.loads(json.dumps(run_example())); assert actual == expected'
      - name: Verify saved Day98 embedding evidence
        run: |
          python -c 'import json; from pathlib import Path; from examples.day98_embedding_selection_versioning import run_example; expected = json.loads(Path("evidence/day98-embedding-experiment-report.json").read_text()); actual = json.loads(json.dumps(run_example())); assert actual == expected'
          python -c 'import json; from pathlib import Path; from rag_embedding_experiments import run_selection_experiment; expected = json.loads(Path("evidence/day98-model-selection-matrix.json").read_text()); actual = json.loads(json.dumps(run_selection_experiment())); assert actual == expected'
      - name: Verify saved Day99 vector evidence
        run: |
          python -c 'import json; from pathlib import Path; from examples.day99_vector_database_index_design import run_example; expected = json.loads(Path("evidence/day99-index-build-report.json").read_text()); actual = json.loads(json.dumps(run_example())); assert actual == expected'
          python -c 'import json; from pathlib import Path; from rag_vector_index_experiments import run_controlled_index_experiment; expected = json.loads(Path("evidence/day99-index-experiment-report.json").read_text()); actual = json.loads(json.dumps(run_controlled_index_experiment())); assert actual == expected'
          python -c 'import json; from pathlib import Path; from rag_vector_store_selection import run_store_selection_experiment; expected = json.loads(Path("evidence/day99-vector-store-selection-matrix.json").read_text()); actual = json.loads(json.dumps(run_store_selection_experiment())); assert actual == expected'
      - name: Verify saved Day100 hybrid retrieval evidence
        run: python evals/run_day100_evidence_replay.py
      - name: Verify saved Day101 query rewrite and reranking evidence
        run: python evals/run_day101_evidence_replay.py
      - name: Verify saved Day102 grounding and citation evidence
        run: python evals/run_day102_evidence_replay.py
      - name: Verify saved Day103 RAG evaluation evidence
        run: python evals/run_day103_evidence_replay.py
      - name: Verify saved Day104 index lifecycle evidence
        run: python evals/run_day104_evidence_replay.py
      - name: Verify saved Day104 L3 evidence offline
        run: python evals/run_day104_l3_evidence_replay.py
      - name: Verify saved Day105 RAG security evidence
        run: python evals/run_day105_evidence_replay.py
      - name: Verify saved Day105 L3 security evidence offline
        run: python evals/run_day105_l3_evidence_replay.py
      - name: Parse current structured evidence
        run: >-
          python -c 'import json; from pathlib import Path;
          root=Path(".");
          [json.loads(path.read_text()) for path in root.rglob("*.json")];
          [json.loads(line) for path in root.rglob("*.jsonl")
          for line in path.read_text().splitlines() if line.strip()]'
      - name: Verify saved Day106 L2 evidence at its exact checkpoint
        run: |
          l2_root="$RUNNER_TEMP/day106-l2-replay"
          l2_archive="$RUNNER_TEMP/day106-l2-replay.tar"
          mkdir -p "$l2_root"
          git -C "$GITHUB_WORKSPACE" archive \
            --format=tar \
            --output="$l2_archive" \
            91c2eddf3b10fbe1d6b0e381ee84ebb009039a5c \
            projects/ai-agent
          tar -xf "$l2_archive" -C "$l2_root"
          cd "$l2_root/projects/ai-agent"
          PYTHONPATH=src:. python evals/run_day106_evidence_replay.py
      - name: Verify saved Day106 L3A evidence offline
        run: |
          python evals/run_day106_l3_evidence_replay.py \
            --integration-report evidence/day106-l3a-integration-report-v2.json \
            --restart-report evidence/day106-l3a-restart-replay-v2.json \
            --schema evidence/day106-l3a-evidence-schema.json \
            --correction evidence/day106-l3a-integration-report-v1-correction.json \
            --artifact-root .
      - name: Verify saved Day106 L3B evidence offline
        run: |
          python -c 'import json; from pathlib import Path; from evals.run_day106_l3b_evidence_replay import validate_reports; expected = json.loads(Path("evidence/day106-l3b-evidence-replay.json").read_text()); actual = validate_reports(Path("evidence/day106-l3b-external-integration-report.json"), Path("evidence/day106-l3b-restart-replay.json"), schema_path=Path("evidence/day106-l3b-evidence-schema.json"), artifact_root=Path(".")); assert actual == expected'
