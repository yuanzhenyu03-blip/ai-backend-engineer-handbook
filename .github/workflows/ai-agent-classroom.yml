name: AI agent classroom quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-agent-classroom:
    name: Python 3.12 tests and seed evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/ai-agent
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned classroom integration dependencies
        run: python -m pip install -r requirements-day88.txt -r requirements-day90.txt
      - name: Check interpreter and compile Python sources
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python -m compileall -q src tests evals examples
      - name: Run full AI agent regression suite
        run: python -m unittest discover -s tests -q
      - name: Run every available seed evaluator
        run: |
          for evaluator in evals/run_day*_seed_eval.py; do
            python "$evaluator"
          done
      - name: Verify saved Day96 experiment report
        run: |
          python -c 'import json; from pathlib import Path; from examples.day96_chunking_experiments import run_example; expected = json.loads(Path("evidence/day96-experiment-report.json").read_text()); actual = json.loads(json.dumps(run_example())); assert actual == expected'
